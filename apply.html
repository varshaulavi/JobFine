
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job - JobFine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>JobFine</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="form-container">

    <h1>Job Application Form</h1>
    <p>Fill in your details to apply.</p>

    <form id="applicationForm">

        <label>Full Name</label>
        <input type="text" id="appName" required>

        <label>Email</label>
        <input type="email" id="appEmail" required>

        <label>Phone Number</label>
        <input type="tel" id="appPhone" pattern="[0-9]{10}" required>

        <label>Job Position</label>
        <input type="text" id="appJob" required>

        <label>Qualification</label>
        <input type="text" id="appQualification" required>

        <label>Skills</label>
        <textarea id="appSkills" required></textarea>

        <label>Upload Resume (PDF)</label>
        <input type="file" id="appResume"
        accept=".pdf" required>

        <button type="submit">Submit Application</button>

    </form>

    <p id="applicationMessage"></p>

</main>

<script src="script.js"></script>
</body>
</html>
